apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: n8n-serverless
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Cloud SQL Auth Proxy sidecar — removing this annotation breaks DB connectivity.
        # Use 'gcloud run services replace' (not update --set-env-vars) to preserve it.
        run.googleapis.com/cloudsql-instances: betterprep-main-account:us-central1:n8n-postgres
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 900
      containers:
      - image: gcr.io/betterprep-main-account/n8n:latest
        ports:
        - name: http1
          containerPort: 5678
        resources:
          limits:
            memory: 4Gi
            cpu: "2"
        env:
        # ── Database ────────────────────────────────────────────────────────
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: /cloudsql/betterprep-main-account:us-central1:n8n-postgres
        - name: DB_POSTGRESDB_PORT
          value: "5432"
        - name: DB_POSTGRESDB_DATABASE
          value: n8n-postgres
        - name: DB_POSTGRESDB_USER
          value: postgres
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-db-password
              key: latest
        - name: DB_POSTGRESDB_SCHEMA
          value: public
        - name: DB_POSTGRESDB_CONNECTION_TIMEOUT
          value: "120000"
        - name: DB_POSTGRESDB_POOL_SIZE
          value: "4"
        # ── n8n core ────────────────────────────────────────────────────────
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-encryption-key
              key: latest
        - name: N8N_RUNNERS_ENABLED
          value: "false"
        - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
          value: "false"
        - name: N8N_DIAGNOSTICS_ENABLED
          value: "false"
        - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
          value: "false"
        - name: N8N_DISABLE_UI
          value: "false"
        - name: N8N_SKIP_OWNER_SETUP
          value: "false"
        # ── Network / URLs ──────────────────────────────────────────────────
        - name: N8N_HOST
          value: "0.0.0.0"
        - name: N8N_PORT
          value: "5678"
        - name: N8N_PROTOCOL
          value: https
        - name: N8N_PROXY_HOPS
          value: "1"
        - name: N8N_PATH
          value: /
        - name: N8N_LISTEN_ADDRESS
          value: "0.0.0.0"
        - name: N8N_ENDPOINT_REST
          value: rest
        - name: WEBHOOK_URL
          value: https://n8n-serverless-1069021792204.us-central1.run.app
        - name: N8N_EDITOR_BASE_URL
          value: https://n8n-serverless-1069021792204.us-central1.run.app
        # ── Auth ────────────────────────────────────────────────────────────
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          value: admin
        - name: N8N_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-basic-auth-password
              key: latest
        # ── Runtime ─────────────────────────────────────────────────────────
        - name: NODE_ENV
          value: production
        - name: GENERIC_TIMEZONE
          value: UTC
        - name: TZ
          value: UTC
  traffic:
  - percent: 100
    latestRevision: true
