steps:
# Build Docker image with custom n8n configuration
# Removed --pull to use cached layers and avoid pull issues
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/${_PROJECT_ID}/n8n:$BUILD_ID', '.']

# Push image with build ID tag
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${_PROJECT_ID}/n8n:$BUILD_ID']

# Also tag as latest
- name: 'gcr.io/cloud-builders/docker'
  args: ['tag', 'gcr.io/${_PROJECT_ID}/n8n:$BUILD_ID', 'gcr.io/${_PROJECT_ID}/n8n:latest']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${_PROJECT_ID}/n8n:latest']

# Deploy to Cloud Run by replacing the full service spec from infra/n8n-service.yaml.
# This preserves ALL annotations (including cloudsql-instances) on every deploy.
# Never swap this back to 'gcloud run deploy' or 'gcloud run services update'.
- name: 'gcr.io/cloud-builders/gcloud'
  args: [
    'run', 'services', 'replace', 'infra/n8n-service.yaml',
    '--region', '${_REGION}',
    '--project', '${_PROJECT_ID}'
  ]

images:
- 'gcr.io/${_PROJECT_ID}/n8n:$BUILD_ID'
- 'gcr.io/${_PROJECT_ID}/n8n:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
