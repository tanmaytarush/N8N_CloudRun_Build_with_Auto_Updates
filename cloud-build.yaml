steps:
# Build Docker image with custom n8n configuration
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/${_PROJECT_ID}/n8n:$BUILD_ID', '.']

# Push image with build ID tag
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${_PROJECT_ID}/n8n:$BUILD_ID']

# Also tag as latest
- name: 'gcr.io/cloud-builders/docker'
  args: ['tag', 'gcr.io/${_PROJECT_ID}/n8n:$BUILD_ID', 'gcr.io/${_PROJECT_ID}/n8n:latest']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${_PROJECT_ID}/n8n:latest']

# Deploy to Cloud Run with n8n Docker Compose configuration
- name: 'gcr.io/cloud-builders/gcloud'
  args: [
    'run', 'deploy', '${_SERVICE_NAME}',
    '--image', 'gcr.io/${_PROJECT_ID}/n8n:latest',
    '--region', '${_REGION}',
    '--platform', 'managed',
    '--allow-unauthenticated',
    '--port', '5678',
    '--memory', '4Gi',
    '--cpu', '2',
    '--min-instances', '1',
    '--max-instances', '3',
    '--concurrency', '80',
    '--timeout', '900',
    '--ingress', 'all',
    '--set-env-vars', 'N8N_HOST=0.0.0.0,N8N_PORT=5678,N8N_PROTOCOL=https,N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true,N8N_RUNNERS_ENABLED=false,N8N_DIAGNOSTICS_ENABLED=false,NODE_ENV=production,DB_TYPE=sqlite,DB_SQLITE_DATABASE=/tmp/n8n.db,DB_SQLITE_POOL_SIZE=3,N8N_BASIC_AUTH_ACTIVE=true,N8N_BASIC_AUTH_USER=admin,N8N_BASIC_AUTH_PASSWORD=M#x46$$LZ&fUtc2u,N8N_ENCRYPTION_KEY=2d51aedbfbffe89d9ad53182bd966398,GENERIC_TIMEZONE=UTC,TZ=UTC,N8N_WEBHOOK_URL=https://n8n-serverless-1069021792204.us-central1.run.app,N8N_EDITOR_BASE_URL=https://n8n-serverless-1069021792204.us-central1.run.app,N8N_BLOCK_ENV_ACCESS_IN_NODE=false,N8N_DISABLE_UI=false,N8N_SKIP_OWNER_SETUP=false'
  ]

images:
- 'gcr.io/${_PROJECT_ID}/n8n:$BUILD_ID'
- 'gcr.io/${_PROJECT_ID}/n8n:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
